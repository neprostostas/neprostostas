<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-label="Stanislav Kinash - Frontend Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B0F14" stop-opacity="1"/>
      <stop offset="45%" stop-color="#111827" stop-opacity="1"/>
      <stop offset="75%" stop-color="#1D1530" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#2B1734" stop-opacity="0"/>
    </linearGradient>
    <style>
      .page-bg { fill: #0d1117; }
      /* Accent under-wave: colored band, not same page-bg as the front edge */
      .wave-soft { fill: #7A68B8; opacity: 0.38; }
      .title, .subtitle {
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif;
        text-anchor: middle;
        text-rendering: geometricPrecision;
      }
      .title { font-size: 66px; font-weight: 750; letter-spacing: -1.8px; fill: #f5f5f7; }
      .subtitle { font-size: 25px; font-weight: 560; letter-spacing: -0.35px; fill: #B8A7E8; }
      @media (prefers-color-scheme: light) {
        .page-bg { fill: #ffffff; }
        .wave-soft { fill: #9B8AD4; opacity: 0.28; }
      }
    </style>
  </defs>

  <rect width="1200" height="250" fill="url(#bg)"/>

  <g>
    <text x="600" y="88" class="title">STANISLAV KINASH</text>
    <text x="600" y="128" class="subtitle">Frontend Engineer | Vue.js | React | PixiJS/WebGL</text>
  </g>

  <!-- Waves kept near the bottom of the taller canvas -->
  <path class="wave-soft"
        d="M0 176 C170 162 310 184 480 172 C650 160 800 154 945 166 C1045 174 1130 188 1200 200 L1200 250 L0 250 Z">
    <animate attributeName="d"
      dur="16s"
      repeatCount="indefinite"
      calcMode="spline"
      keyTimes="0;0.25;0.5;0.75;1"
      keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1"
      values="
      M0 176 C170 162 310 184 480 172 C650 160 800 154 945 166 C1045 174 1130 188 1200 200 L1200 250 L0 250 Z;
      M0 170 C160 192 330 202 495 180 C660 158 815 142 955 152 C1055 160 1135 182 1200 192 L1200 250 L0 250 Z;
      M0 182 C185 166 325 152 490 164 C655 176 820 194 960 184 C1060 176 1140 162 1200 196 L1200 250 L0 250 Z;
      M0 174 C175 156 320 170 485 182 C650 194 810 186 950 170 C1050 158 1135 164 1200 194 L1200 250 L0 250 Z;
      M0 176 C170 162 310 184 480 172 C650 160 800 154 945 166 C1045 174 1130 188 1200 200 L1200 250 L0 250 Z"/>
  </path>

  <path class="page-bg"
        d="M0 188 C180 172 320 195 485 185 C650 175 795 171 940 180 C1040 186 1125 199 1200 210 L1200 250 L0 250 Z">
    <animate attributeName="d"
      dur="11s"
      repeatCount="indefinite"
      calcMode="spline"
      keyTimes="0;0.25;0.5;0.75;1"
      keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1"
      values="
      M0 188 C180 172 320 195 485 185 C650 175 795 171 940 180 C1040 186 1125 199 1200 210 L1200 250 L0 250 Z;
      M0 182 C165 206 335 214 500 192 C665 170 820 152 955 162 C1055 170 1130 192 1200 202 L1200 250 L0 250 Z;
      M0 194 C195 176 340 162 505 174 C670 186 830 204 965 194 C1065 186 1140 174 1200 206 L1200 250 L0 250 Z;
      M0 186 C185 166 330 180 495 194 C660 208 815 200 950 182 C1050 170 1135 176 1200 204 L1200 250 L0 250 Z;
      M0 188 C180 172 320 195 485 185 C650 175 795 171 940 180 C1040 186 1125 199 1200 210 L1200 250 L0 250 Z"/>
  </path>
</svg>
