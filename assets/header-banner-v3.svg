<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="210" viewBox="0 0 1200 210" role="img" aria-label="Stanislav Kinash - Frontend Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0B0F14"/>
      <stop offset="45%" stop-color="#111827"/>
      <stop offset="75%" stop-color="#1D1530"/>
      <stop offset="100%" stop-color="#2B1734"/>
    </linearGradient>

    <linearGradient id="waveFront" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7657F0"/>
      <stop offset="52%" stop-color="#5572E6"/>
      <stop offset="100%" stop-color="#3C97D4"/>
    </linearGradient>

    <linearGradient id="waveMid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7D63F3" stop-opacity="0.42"/>
      <stop offset="52%" stop-color="#6480EA" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#48A4DF" stop-opacity="0.38"/>
