<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="210" viewBox="0 0 1200 210" role="img" aria-label="Stanislav Kinash - Frontend Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0B0F14"/>
      <stop offset="45%" stop-color="#111827"/>
      <stop offset="75%" stop-color="#1D1530"/>
      <stop offset="100%" stop-color="#2B1734"/>
    </linearGradient>
    <style>
      .page-bg { fill: #0d1117; }
      .page-bg-soft { fill: #0d1117; opacity: 0.55; }
      .title, .subtitle {
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif;
        text-anchor: middle;
        text-rendering: geometricPrecision;
      }
      .title { font-size: 66px; font-weight: 750; letter-spacing: -1.8px; fill: #f5f5f7; }
      .subtitle { font-size: 25px; font-weight: 560; letter-spacing: -0.35px; fill: #B8A7E8; }
      @media (prefers-color-scheme: light) {
        .page-bg, .page-bg-soft { fill: #ffffff; }
      }
    </style>
  </defs>

  <rect width="1200" height="210" fill="url(#bg)"/>

  <!-- Soft under-layer of the same page-bg edge, slightly offset timing -->
  <path class="page-bg-soft"
        d="M0 152 C170 138 310 160 480 148 C650 136 800 130 945 142 C1045 150 1130 164 1200 176 L1200 210 L0 210 Z">
    <animate attributeName="d"
      dur="16s"
      repeatCount="indefinite"
      calcMode="spline"
      keyTimes="0;0.25;0.5;0.75;1"
      keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1"
      values="
      M0 152 C170 138 310 160 480 148 C650 136 800 130 945 142 C1045 150 1130 164 1200 176 L1200 210 L0 210 Z;
      M0 146 C160 168 330 178 495 156 C660 134 815 118 955 128 C1055 136 1135 158 1200 168 L1200 210 L0 210 Z;
      M0 158 C185 142 325 128 490 140 C655 152 820 170 960 160 C1060 152 1140 138 1200 172 L1200 210 L0 210 Z;
      M0 150 C175 132 320 146 485 158 C650 170 810 162 950 146 C1050 134 1135 140 1200 170 L1200 210 L0 210 Z;
      M0 152 C170 138 310 160 480 148 C650 136 800 130 945 142 C1045 150 1130 164 1200 176 L1200 210 L0 210 Z"/>
  </path>

  <!-- Original header edge curve — animated in place -->
  <path class="page-bg"
        d="M0 164 C180 148 320 171 485 161 C650 151 795 147 940 156 C1040 162 1125 175 1200 186 L1200 210 L0 210 Z">
    <animate attributeName="d"
      dur="11s"
      repeatCount="indefinite"
      calcMode="spline"
      keyTimes="0;0.25;0.5;0.75;1"
      keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1"
      values="
      M0 164 C180 148 320 171 485 161 C650 151 795 147 940 156 C1040 162 1125 175 1200 186 L1200 210 L0 210 Z;
      M0 158 C165 182 335 190 500 168 C665 146 820 128 955 138 C1055 146 1130 168 1200 178 L1200 210 L0 210 Z;
      M0 170 C195 152 340 138 505 150 C670 162 830 180 965 170 C1065 162 1140 150 1200 182 L1200 210 L0 210 Z;
      M0 162 C185 142 330 156 495 170 C660 184 815 176 950 158 C1050 146 1135 152 1200 180 L1200 210 L0 210 Z;
      M0 164 C180 148 320 171 485 161 C650 151 795 147 940 156 C1040 162 1125 175 1200 186 L1200 210 L0 210 Z"/>
  </path>

  <g>
    <text x="600" y="90" class="title">STANISLAV KINASH</text>
    <text x="600" y="130" class="subtitle">Frontend Engineer | Vue.js | React | PixiJS/WebGL</text>
  </g>
