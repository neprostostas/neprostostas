<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-label="Stanislav Kinash - Frontend Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0B0F14"/>
      <stop offset="45%" stop-color="#111827"/>
      <stop offset="75%" stop-color="#1D1530"/>
      <stop offset="100%" stop-color="#2B1734"/>
    </linearGradient>
    <style>
      .wave-back { fill: #0d1117; opacity: 0.28; }
      .wave-mid { fill: #0d1117; opacity: 0.52; }
      .wave-front { fill: #0d1117; }
      .title, .subtitle {
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif;
        text-anchor: middle;
        text-rendering: geometricPrecision;
      }
      .title { font-size: 66px; font-weight: 750; letter-spacing: -1.8px; fill: #f5f5f7; }
      .subtitle { font-size: 25px; font-weight: 560; letter-spacing: -0.35px; fill: #B8A7E8; }
      @media (prefers-color-scheme: light) {
        .wave-back, .wave-mid, .wave-front { fill: #ffffff; }
      }
    </style>
  </defs>

  <rect width="1200" height="250" fill="url(#bg)"/>

  <g>
    <text x="600" y="88" class="title">STANISLAV KINASH</text>
    <text x="600" y="128" class="subtitle">Frontend Engineer | Vue.js | React | PixiJS/WebGL</text>
  </g>

  <!--
    Three stacked edges of the same page-bg color.
    Crest bands stay separated so the solid front never pokes through the softer layers:
      back  ~158–176, mid ~182–198, front ~204–218
  -->

  <!-- Back (highest, softest) -->
  <path class="wave-back"
        d="M0 168 C175 154 320 172 490 164 C660 156 810 150 960 160 C1065 168 1140 178 1200 186 L1200 250 L0 250 Z">
    <animate attributeName="d"
      dur="18s"
      repeatCount="indefinite"
      calcMode="spline"
      keyTimes="0;0.25;0.5;0.75;1"
      keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1"
      values="
      M0 168 C175 154 320 172 490 164 C660 156 810 150 960 160 C1065 168 1140 178 1200 186 L1200 250 L0 250 Z;
      M0 160 C165 176 335 180 500 168 C665 156 820 148 965 154 C1070 160 1145 172 1200 180 L1200 250 L0 250 Z;
      M0 172 C185 158 330 148 495 156 C660 164 825 174 970 168 C1075 164 1145 158 1200 184 L1200 250 L0 250 Z;
      M0 166 C180 152 325 160 490 170 C655 180 815 172 960 162 C1065 156 1140 162 1200 182 L1200 250 L0 250 Z;
      M0 168 C175 154 320 172 490 164 C660 156 810 150 960 160 C1065 168 1140 178 1200 186 L1200 250 L0 250 Z"/>
  </path>

  <!-- Mid -->
  <path class="wave-mid"
        d="M0 190 C170 176 315 192 485 186 C655 180 805 174 955 182 C1060 188 1135 198 1200 204 L1200 250 L0 250 Z">
    <animate attributeName="d"
      dur="13s"
      repeatCount="indefinite"
      calcMode="spline"
      keyTimes="0;0.25;0.5;0.75;1"
      keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1"
      values="
      M0 190 C170 176 315 192 485 186 C655 180 805 174 955 182 C1060 188 1135 198 1200 204 L1200 250 L0 250 Z;
      M0 184 C160 198 330 202 495 190 C660 178 815 170 960 176 C1065 182 1140 194 1200 200 L1200 250 L0 250 Z;
      M0 196 C180 182 325 172 490 180 C655 188 820 198 965 192 C1070 188 1140 182 1200 202 L1200 250 L0 250 Z;
      M0 188 C175 174 320 182 485 194 C650 206 810 198 955 186 C1060 180 1135 186 1200 200 L1200 250 L0 250 Z;
      M0 190 C170 176 315 192 485 186 C655 180 805 174 955 182 C1060 188 1135 198 1200 204 L1200 250 L0 250 Z"/>
  </path>

  <!-- Front (lowest, solid — crest stays under the mid band) -->
  <path class="wave-front"
        d="M0 212 C180 198 325 210 490 206 C655 202 805 196 955 202 C1060 206 1135 214 1200 218 L1200 250 L0 250 Z">
    <animate attributeName="d"
      dur="9.5s"
      repeatCount="indefinite"
      calcMode="spline"
      keyTimes="0;0.25;0.5;0.75;1"
      keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1"
      values="
      M0 212 C180 198 325 210 490 206 C655 202 805 196 955 202 C1060 206 1135 214 1200 218 L1200 250 L0 250 Z;
      M0 208 C170 218 335 220 500 210 C665 200 820 194 965 198 C1070 202 1140 212 1200 216 L1200 250 L0 250 Z;
      M0 216 C190 204 340 196 505 202 C670 208 830 216 970 212 C1075 210 1145 206 1200 218 L1200 250 L0 250 Z;
      M0 210 C185 198 330 204 495 214 C660 224 815 218 960 208 C1065 204 1140 208 1200 216 L1200 250 L0 250 Z;
      M0 212 C180 198 325 210 490 206 C655 202 805 196 955 202 C1060 206 1135 214 1200 218 L1200 250 L0 250 Z"/>
  </path>
</svg>
