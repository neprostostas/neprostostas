      M0 168 C165 192 335 200 500 178 C665 156 820 138 955 148 C1055 156 1130 178 1200 188 L1200 250 L0 250 Z;
      M0 180 C195 162 340 148 505 160 C670 172 830 190 965 180 C1065 172 1140 160 1200 192 L1200 250 L0 250 Z;
      M0 172 C185 152 330 166 495 180 C660 194 815 186 950 168 C1050 156 1135 162 1200 190 L1200 250 L0 250 Z;
      M0 174 C180 158 320 181 485 171 C650 161 795 157 940 166 C1040 172 1125 185 1200 196 L1200 250 L0 250 Z"/>
