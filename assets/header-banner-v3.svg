<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-label="Stanislav Kinash - Frontend Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0B0F14"/>
      <stop offset="45%" stop-color="#111827"/>
      <stop offset="75%" stop-color="#1D1530"/>
      <stop offset="100%" stop-color="#2B1734"/>
    </linearGradient>

    <!-- Footer layering logic, header page-bg color -->
    <linearGradient id="waveFront" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="waveMid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d1117" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0.38"/>
    </linearGradient>
    <linearGradient id="waveBack" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d1117" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0.18"/>
    </linearGradient>

    <style>
      .title, .subtitle {
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif;
        text-anchor: middle;
        text-rendering: geometricPrecision;
      }
      .title { font-size: 66px; font-weight: 750; letter-spacing: -1.8px; fill: #f5f5f7; }
      .subtitle { font-size: 25px; font-weight: 560; letter-spacing: -0.35px; fill: #B8A7E8; }
      @media (prefers-color-scheme: light) {
        #waveFront stop, #waveMid stop, #waveBack stop { stop-color: #ffffff; }
      }
    </style>
  </defs>

  <rect width="1200" height="250" fill="url(#bg)"/>

  <g>
    <text x="600" y="88" class="title">STANISLAV KINASH</text>
    <text x="600" y="128" class="subtitle">Frontend Engineer | Vue.js | React | PixiJS/WebGL</text>
  </g>

