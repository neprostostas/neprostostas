    <style>
      .title, .subtitle {
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif;
        text-anchor: middle;
        text-rendering: geometricPrecision;
      }
      .title { font-size: 66px; font-weight: 750; letter-spacing: -1.8px; fill: #f5f5f7; }
      .subtitle { font-size: 25px; font-weight: 560; letter-spacing: -0.35px; fill: #B8A7E8; }
      @media (prefers-color-scheme: light) {
        .title { fill: #111827; }
        .subtitle { fill: #5B4F8C; }
      }
    </style>
  </defs>

  <!-- Text band: plain rectangle, separate from the waves -->
