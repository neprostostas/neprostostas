<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Stanislav Kinash's Contribution Graph" fill="none">
  <defs>
    <linearGradient id="card-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#15171c"/>
      <stop offset="100%" stop-color="#090a0d"/>
    </linearGradient>
    <linearGradient id="shelf-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0a84ff"/>
      <stop offset="52%" stop-color="#bf5af2"/>
      <stop offset="100%" stop-color="#ff375f"/>
    </linearGradient>
    <linearGradient id="title-name" gradientUnits="objectBoundingBox" x1="0" y1="0" x2="1" y2="0" spreadMethod="repeat">
      <!-- 0% == 100% so translate(-1) loops with no seam -->
      <stop offset="0%" stop-color="#0a84ff"/>
      <stop offset="25%" stop-color="#bf5af2"/>
      <stop offset="50%" stop-color="#ff375f"/>
      <stop offset="75%" stop-color="#bf5af2"/>
      <stop offset="100%" stop-color="#0a84ff"/>
      <animateTransform
        attributeName="gradientTransform"
        type="translate"
        from="0 0"
        to="-1 0"
        dur="3.5s"
        repeatCount="indefinite"
        calcMode="linear"/>
    </linearGradient>
    <linearGradient id="line-stroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#64d2ff"/>
      <stop offset="45%" stop-color="#0a84ff"/>
      <stop offset="100%" stop-color="#bf5af2"/>
    </linearGradient>
    <linearGradient id="area-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a84ff" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#bf5af2" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ff375f" stop-opacity="0.02"/>
    </linearGradient>
    <style type="text/css"><![CDATA[
      text {
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif;
        text-rendering: geometricPrecision;
      }
      .header {
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: -0.45px;
      }
      .ct-label {
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif;
        fill: #98989f;
        font-size: 13px;
        font-weight: 500;
        letter-spacing: -0.1px;
      }
      .ct-axis-title {
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif;
        fill: #98989f;
        font-size: 16px;
        font-weight: 600;
        letter-spacing: -0.15px;
      }
      .ct-grid {
        stroke: #343741;
        stroke-width: 1px;
        stroke-opacity: 0.85;
        stroke-dasharray: 2px;
      }
      .ct-line {
        fill: none;
        stroke: url(#line-stroke);
        stroke-width: 3.2px;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 5000;
        stroke-dashoffset: 5000;
        animation: dash 5s ease-in-out forwards;
      }
      .ct-area {
        stroke: none;
        fill: url(#area-fill);
        fill-opacity: 1;
      }
      .ct-point {
        stroke: #64d2ff;
        stroke-width: 8px;
        stroke-linecap: round;
        animation: blink 1s ease-in-out forwards;
      }
      @keyframes blink {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes dash {
        to { stroke-dashoffset: 0; }
      }
    ]]></style>
  </defs>

