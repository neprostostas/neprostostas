<?xml version="1.0" encoding="UTF-8"?>
    <svg xmlns="http://www.w3.org/2000/svg" width="450" height="245" viewBox="0 0 450 245" role="img" aria-label="GitHub Overview">
      
    <defs>
      <linearGradient id="card-bg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#15171c"/>
        <stop offset="100%" stop-color="#090a0d"/>
