        <stop offset="1" stop-color="#bf5af2" stop-opacity="0"/>
      </radialGradient>
      <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="160%">
        <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.32"/>
      </filter>
      
      <style>
        text {
          font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
          text-rendering: geometricPrecision;
        }
        .heading { font-size: 21px; font-weight: 700; fill: #f5f5f7; letter-spacing: -0.35px; }
        .caption { font-size: 10.5px; font-weight: 500; fill: #98989f; }
        .metric-label { font-size: 10px; font-weight: 520; fill: #98989f; }
        .metric-value { font-size: 22px; font-weight: 730; fill: #f5f5f7; letter-spacing: -0.55px; }
      </style>
    </defs>
      <rect x="7" y="9" width="906" height="214" rx="24" fill="#000000" opacity="0.24" filter="url(#soft-shadow)"/>
      <rect x="1" y="1" width="918" height="228" rx="23" fill="url(#card-bg)" stroke="#343741" stroke-width="1.25"/>
      <rect x="1" y="1" width="918" height="228" rx="23" fill="url(#blue-glow)"/>
      <rect x="1" y="1" width="918" height="228" rx="23" fill="url(#purple-glow)"/>
      <path d="M24 1 H896" stroke="url(#accent)" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
      <text x="22" y="34" class="heading">Contribution Activity</text>
      <text x="22" y="53" class="caption">Live overview of your GitHub consistency</text>
      
    
