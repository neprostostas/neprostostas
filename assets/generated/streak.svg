<?xml version="1.0" encoding="UTF-8"?>
    <svg xmlns="http://www.w3.org/2000/svg" width="920" height="230" viewBox="0 0 920 230" role="img" aria-label="Contribution Activity">
      
    <defs>
      <linearGradient id="card-bg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#15171c"/>
        <stop offset="100%" stop-color="#090a0d"/>
      </linearGradient>
      <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#0a84ff"/>
        <stop offset="52%" stop-color="#bf5af2"/>
        <stop offset="100%" stop-color="#ff375f"/>
      </linearGradient>
      <radialGradient id="blue-glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(82 26) rotate(35) scale(205 130)">
        <stop stop-color="#0a84ff" stop-opacity="0.20"/>
        <stop offset="1" stop-color="#0a84ff" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="purple-glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(430 230) rotate(-140) scale(220 155)">
