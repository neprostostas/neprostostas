<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="260" viewBox="0 0 1600 260" role="img" aria-label="Thanks for visiting footer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#070d1c"/>
      <stop offset="55%" stop-color="#10182d"/>
      <stop offset="100%" stop-color="#171127"/>
    </linearGradient>

    <linearGradient id="waveFront" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6f52e9"/>
      <stop offset="52%" stop-color="#4f6fdf"/>
      <stop offset="100%" stop-color="#3595d1"/>
    </linearGradient>

    <linearGradient id="waveMid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7a5cf0" stop-opacity="0.38"/>
      <stop offset="52%" stop-color="#5d73e9" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#47a0df" stop-opacity="0.34"/>
    </linearGradient>

    <linearGradient id="waveBack" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8e72ff" stop-opacity="0.18"/>
      <stop offset="52%" stop-color="#6d86f0" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#57b0e7" stop-opacity="0.16"/>
    </linearGradient>

    <filter id="soft" x="-20%" y="-20%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <style>
      text {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
        fill: #f5f7fb;
      }
      .title {
        font-size: 60px;
        font-weight: 780;
        letter-spacing: -1.2px;
      }
      .sub {
        font-size: 20px;
        font-weight: 500;
        fill: #b7bed3;
      }
      @media (prefers-color-scheme: light) {
        .title { fill: #111827; }
        .sub { fill: #4b5563; }
      }
    </style>
  </defs>

  <rect width="1600" height="260" fill="url(#bg)"/>

  <ellipse cx="1220" cy="36" rx="310" ry="82" fill="#8b5cf6" opacity="0.10" filter="url(#soft)"/>
  <ellipse cx="360" cy="42" rx="290" ry="76" fill="#60a5fa" opacity="0.07" filter="url(#soft)"/>

  <!-- Back wave -->
  <path fill="url(#waveBack)"
        d="M0 164 C180 146, 340 154, 510 170 C700 188, 910 186, 1100 170 C1280 154, 1440 148, 1600 160 L1600 260 L0 260 Z">
    <animate attributeName="d" dur="12s" repeatCount="indefinite"
      values="
      M0 164 C180 146, 340 154, 510 170 C700 188, 910 186, 1100 170 C1280 154, 1440 148, 1600 160 L1600 260 L0 260 Z;
      M0 158 C170 172, 350 184, 530 174 C710 164, 900 146, 1086 150 C1260 154, 1436 172, 1600 166 L1600 260 L0 260 Z;
      M0 170 C200 154, 380 142, 548 156 C732 172, 930 188, 1116 180 C1294 172, 1454 152, 1600 158 L1600 260 L0 260 Z;
      M0 164 C180 146, 340 154, 510 170 C700 188, 910 186, 1100 170 C1280 154, 1440 148, 1600 160 L1600 260 L0 260 Z"/>
  </path>

  <!-- Middle wave -->
  <path fill="url(#waveMid)"
        d="M0 182 C140 166, 280 160, 446 170 C620 180, 790 204, 964 198 C1126 192, 1286 162, 1600 182 L1600 260 L0 260 Z">
    <animate attributeName="d" dur="8.5s" repeatCount="indefinite"
      values="
      M0 182 C140 166, 280 160, 446 170 C620 180, 790 204, 964 198 C1126 192, 1286 162, 1600 182 L1600 260 L0 260 Z;
      M0 176 C166 196, 324 206, 492 194 C664 182, 822 154, 992 156 C1164 158, 1330 186, 1600 174 L1600 260 L0 260 Z;
      M0 186 C152 170, 312 154, 484 164 C650 174, 812 192, 978 186 C1148 180, 1324 168, 1600 186 L1600 260 L0 260 Z;
      M0 182 C140 166, 280 160, 446 170 C620 180, 790 204, 964 198 C1126 192, 1286 162, 1600 182 L1600 260 L0 260 Z"/>
  </path>

  <!-- Front wave -->
  <path fill="url(#waveFront)"
        d="M0 198 C168 176, 330 166, 494 178 C660 190, 816 222, 990 212 C1170 202, 1362 178, 1600 190 L1600 260 L0 260 Z">
    <animate attributeName="d" dur="6.8s" repeatCount="indefinite"
      values="
      M0 198 C168 176, 330 166, 494 178 C660 190, 816 222, 990 212 C1170 202, 1362 178, 1600 190 L1600 260 L0 260 Z;
      M0 190 C150 214, 326 220, 500 204 C670 188, 834 164, 1006 172 C1182 180, 1368 204, 1600 194 L1600 260 L0 260 Z;
      M0 202 C176 182, 348 170, 514 182 C688 194, 854 214, 1020 206 C1200 198, 1380 182, 1600 192 L1600 260 L0 260 Z;
      M0 198 C168 176, 330 166, 494 178 C660 190, 816 222, 990 212 C1170 202, 1362 178, 1600 190 L1600 260 L0 260 Z"/>
  </path>

  <text x="800" y="126" text-anchor="middle" class="title">Thanks for visiting! 👋</text>
  <text x="800" y="160" text-anchor="middle" class="sub">See you again in the next commit.</text>
</svg>
