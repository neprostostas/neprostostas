<svg xmlns="http://www.w3.org/2000/svg" width="900" height="55" viewBox="0 0 900 55" role="img" aria-label="Typing animation">
  <defs>
    <linearGradient id="textGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8FA7E8"/>
      <stop offset="48%" stop-color="#A98BE8"/>
      <stop offset="100%" stop-color="#C39BEF"/>
      <animate attributeName="x1" values="0;0.15;0" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;0.85;1" dur="8s" repeatCount="indefinite"/>
    </linearGradient>

    <style>
      .canvas { fill: #ffffff; }
      @media (prefers-color-scheme: dark) {
        .canvas { fill: #0d1117; }
      }
    </style>

    <clipPath id="viewport">
      <rect x="0" y="0" width="900" height="55"/>
    </clipPath>
  </defs>

  <rect class="canvas" x="0" y="0" width="900" height="55"/>

  <!--
    Overlapped swap like web-407 .main-title is-from / is-to:
    while A exits down, B enters from below (same 0.7s window).
    slide=0.7s, hold=1.32s, period=2.02s, full loop=8.08s
  -->
  <g clip-path="url(#viewport)"
     font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace"
     font-size="21" font-weight="600" fill="url(#textGradient)" text-anchor="middle">

    <!-- line 0 -->
    <g transform="translate(0, 63)" opacity="0">
      <animateTransform attributeName="transform" type="translate"
        values="0,63; 0,0; 0,0; 0,63; 0,63"
        keyTimes="0; 0.0866; 0.25; 0.3366; 1"
        keySplines="0.22 0.61 0.36 1; 0 0 1 1; 0.22 0.61 0.36 1; 0 0 1 1"
        calcMode="spline" dur="8.08s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="opacity"
        values="0; 1; 1; 0; 0"
        keyTimes="0; 0.0866; 0.25; 0.3366; 1"
        keySplines="0.4 0 0.2 1; 0 0 1 1; 0.4 0 1 1; 0 0 1 1"
        calcMode="spline" dur="8.08s" begin="0s" repeatCount="indefinite"/>
      <text x="450" y="34">Building interactive web experiences 🚀</text>
    </g>

    <!-- line 1 — starts as line 0 begins exiting -->
    <g transform="translate(0, 63)" opacity="0">
      <animateTransform attributeName="transform" type="translate"
        values="0,63; 0,0; 0,0; 0,63; 0,63"
        keyTimes="0; 0.0866; 0.25; 0.3366; 1"
        keySplines="0.22 0.61 0.36 1; 0 0 1 1; 0.22 0.61 0.36 1; 0 0 1 1"
        calcMode="spline" dur="8.08s" begin="2.02s" repeatCount="indefinite"/>
      <animate attributeName="opacity"
        values="0; 1; 1; 0; 0"
        keyTimes="0; 0.0866; 0.25; 0.3366; 1"
        keySplines="0.4 0 0.2 1; 0 0 1 1; 0.4 0 1 1; 0 0 1 1"
        calcMode="spline" dur="8.08s" begin="2.02s" repeatCount="indefinite"/>
      <text x="450" y="34">Vue • Nuxt • React • Next.js</text>
    </g>

    <!-- line 2 -->
    <g transform="translate(0, 63)" opacity="0">
      <animateTransform attributeName="transform" type="translate"
        values="0,63; 0,0; 0,0; 0,63; 0,63"
        keyTimes="0; 0.0866; 0.25; 0.3366; 1"
        keySplines="0.22 0.61 0.36 1; 0 0 1 1; 0.22 0.61 0.36 1; 0 0 1 1"
        calcMode="spline" dur="8.08s" begin="4.04s" repeatCount="indefinite"/>
      <animate attributeName="opacity"
        values="0; 1; 1; 0; 0"
        keyTimes="0; 0.0866; 0.25; 0.3366; 1"
        keySplines="0.4 0 0.2 1; 0 0 1 1; 0.4 0 1 1; 0 0 1 1"
        calcMode="spline" dur="8.08s" begin="4.04s" repeatCount="indefinite"/>
      <text x="450" y="34">PixiJS • WebGL • GSAP • Spine</text>
    </g>

    <!-- line 3 -->
    <g transform="translate(0, 63)" opacity="0">
      <animateTransform attributeName="transform" type="translate"
        values="0,63; 0,0; 0,0; 0,63; 0,63"
        keyTimes="0; 0.0866; 0.25; 0.3366; 1"
        keySplines="0.22 0.61 0.36 1; 0 0 1 1; 0.22 0.61 0.36 1; 0 0 1 1"
        calcMode="spline" dur="8.08s" begin="6.06s" repeatCount="indefinite"/>
      <animate attributeName="opacity"
        values="0; 1; 1; 0; 0"
        keyTimes="0; 0.0866; 0.25; 0.3366; 1"
        keySplines="0.4 0 0.2 1; 0 0 1 1; 0.4 0 1 1; 0 0 1 1"
        calcMode="spline" dur="8.08s" begin="6.06s" repeatCount="indefinite"/>
      <text x="450" y="34">Crafting smooth interfaces &amp; animations ✨</text>
    </g>
  </g>
</svg>
