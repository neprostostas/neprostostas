name: Generate all profile assets

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: generated-assets-main
  cancel-in-progress: false

jobs:
  profile:
    permissions:
      contents: write

    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Generate Pac-Man contribution graph
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: pacman

      - name: Generate Snake contribution graph
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark

      - name: Generate statistics cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
        run: |
          mkdir -p dist
          node <<'NODE'
          const fs = require('fs');

          const username = process.env.USERNAME;
          const token = process.env.GITHUB_TOKEN;

          const headers = {
            Accept: 'application/vnd.github+json',
            Authorization: `Bearer ${token}`,
            'X-GitHub-Api-Version': '2022-11-28',
            'User-Agent': 'profile-readme-generator'
          };

          const ui = {
            bgTop: '#15171c',
            bgBottom: '#090a0d',
            surface: '#1c1e24',
            surfaceStrong: '#22252d',
            border: '#343741',
            text: '#f5f5f7',
            muted: '#98989f',
            blue: '#0a84ff',
            purple: '#bf5af2',
            pink: '#ff375f',
            cyan: '#64d2ff',
            green: '#30d158',
            orange: '#ff9f0a',
            yellow: '#ffd60a'
          };

          const escapeXml = (value) => String(value)
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&apos;');

          const formatNumber = (value) => new Intl.NumberFormat('en-US').format(Number(value || 0));

          async function github(url, options = {}) {
            const response = await fetch(url, {
              ...options,
              headers: { ...headers, ...(options.headers || {}) }
            });

            if (!response.ok) {
              throw new Error(`${response.status} ${response.statusText}: ${await response.text()}`);
            }

            return response.json();
          }

          async function getRepositories() {
            const repositories = [];

            for (let page = 1; page <= 10; page += 1) {
              const batch = await github(
                `https://api.github.com/users/${username}/repos?type=owner&sort=updated&per_page=100&page=${page}`
              );

              repositories.push(...batch);
              if (batch.length < 100) break;
            }

            return repositories.filter((repo) => !repo.fork && !repo.archived);
          }

          async function getLanguageTotals(repositories) {
            const totals = {};

            for (let index = 0; index < repositories.length; index += 10) {
              const batch = repositories.slice(index, index + 10);
              const results = await Promise.all(
                batch.map(async (repo) => {
                  try {
                    return await github(repo.languages_url);
                  } catch {
                    return {};
                  }
                })
              );

              for (const languages of results) {
                for (const [language, bytes] of Object.entries(languages)) {
                  totals[language] = (totals[language] || 0) + bytes;
                }
              }
            }

            return totals;
          }

          async function getContributions() {
            const to = new Date();
            const from = new Date(to);
            from.setUTCFullYear(from.getUTCFullYear() - 1);

            const query = `
              query($login: String!, $from: DateTime!, $to: DateTime!) {
                user(login: $login) {
                  contributionsCollection(from: $from, to: $to) {
                    totalCommitContributions
                    totalIssueContributions
                    totalPullRequestContributions
                    totalPullRequestReviewContributions
                    restrictedContributionsCount
                    contributionCalendar {
                      totalContributions
                      weeks {
                        contributionDays {
                          date
                          contributionCount
                        }
                      }
                    }
                  }
                }
              }
            `;

            const result = await github('https://api.github.com/graphql', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                query,
                variables: {
                  login: username,
                  from: from.toISOString(),
                  to: to.toISOString()
                }
              })
            });

            if (result.errors?.length) {
              throw new Error(result.errors.map((error) => error.message).join('; '));
            }

            return result.data.user.contributionsCollection;
          }

          function calculateStreaks(days) {
            const sorted = [...days].sort((a, b) => a.date.localeCompare(b.date));
            let longest = 0;
            let running = 0;

            for (const day of sorted) {
              if (day.contributionCount > 0) {
                running += 1;
                longest = Math.max(longest, running);
              } else {
                running = 0;
              }
            }

            let pointer = sorted.length - 1;
            if (pointer >= 0 && sorted[pointer].contributionCount === 0) pointer -= 1;

            let current = 0;
            while (pointer >= 0 && sorted[pointer].contributionCount > 0) {
              current += 1;
              pointer -= 1;
            }

            return { current, longest };
          }

          function commonDefs(extra = '') {
            return `
              <defs>
                <linearGradient id="card-bg" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0%" stop-color="${ui.bgTop}"/>
                  <stop offset="100%" stop-color="${ui.bgBottom}"/>
                </linearGradient>
                <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
                  <stop offset="0%" stop-color="${ui.blue}"/>
                  <stop offset="52%" stop-color="${ui.purple}"/>
                  <stop offset="100%" stop-color="${ui.pink}"/>
                </linearGradient>
                <radialGradient id="blue-glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(82 26) rotate(35) scale(205 130)">
                  <stop stop-color="${ui.blue}" stop-opacity="0.20"/>
                  <stop offset="1" stop-color="${ui.blue}" stop-opacity="0"/>
                </radialGradient>
                <radialGradient id="purple-glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(430 230) rotate(-140) scale(220 155)">
                  <stop stop-color="${ui.purple}" stop-opacity="0.17"/>
                  <stop offset="1" stop-color="${ui.purple}" stop-opacity="0"/>
                </radialGradient>
                <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="160%">
                  <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.32"/>
                </filter>
                ${extra}
                <style>
                  text {
                    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
                    text-rendering: geometricPrecision;
                  }
                  .heading { font-size: 21px; font-weight: 700; fill: ${ui.text}; letter-spacing: -0.35px; }
                  .caption { font-size: 10.5px; font-weight: 500; fill: ${ui.muted}; }
                  .metric-label { font-size: 10px; font-weight: 520; fill: ${ui.muted}; }
                  .metric-value { font-size: 22px; font-weight: 730; fill: ${ui.text}; letter-spacing: -0.55px; }
                </style>
              </defs>`;
          }

          function cardShell(width, height, title, subtitle, body, extraDefs = '') {
            return `<?xml version="1.0" encoding="UTF-8"?>
              <svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" role="img" aria-label="${escapeXml(title)}">
                ${commonDefs(extraDefs)}
                <rect x="7" y="9" width="${width - 14}" height="${height - 16}" rx="24" fill="#000000" opacity="0.24" filter="url(#soft-shadow)"/>
                <rect x="1" y="1" width="${width - 2}" height="${height - 2}" rx="23" fill="url(#card-bg)" stroke="${ui.border}" stroke-width="1.25"/>
                <rect x="1" y="1" width="${width - 2}" height="${height - 2}" rx="23" fill="url(#blue-glow)"/>
                <rect x="1" y="1" width="${width - 2}" height="${height - 2}" rx="23" fill="url(#purple-glow)"/>
                <path d="M24 1 H${width - 24}" stroke="url(#accent)" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
                <text x="22" y="34" class="heading">${escapeXml(title)}</text>
                <text x="22" y="53" class="caption">${escapeXml(subtitle)}</text>
                ${body}
              </svg>`;
          }

          function metricTile(x, y, width, label, value, accentColor) {
            return `
              <g>
                <rect x="${x}" y="${y}" width="${width}" height="49" rx="14" fill="${ui.surface}" fill-opacity="0.78" stroke="#ffffff" stroke-opacity="0.075"/>
                <rect x="${x + 10}" y="${y + 11}" width="3" height="27" rx="1.5" fill="${accentColor}"/>
                <text x="${x + 22}" y="${y + 17}" class="metric-label">${escapeXml(label)}</text>
                <text x="${x + 22}" y="${y + 40}" class="metric-value">${formatNumber(value)}</text>
              </g>`;
          }

          function generateStatsCard(profile, repositories, contributions) {
            const stars = repositories.reduce((sum, repo) => sum + (repo.stargazers_count || 0), 0);
            const values = [
              ['Repositories', profile.public_repos, ui.blue],
              ['Stars earned', stars, ui.yellow],
              ['Followers', profile.followers, ui.cyan],
              ['Contributions', contributions?.contributionCalendar?.totalContributions || 0, ui.purple],
              ['Commits', contributions?.totalCommitContributions || 0, ui.green],
              ['Pull requests', contributions?.totalPullRequestContributions || 0, ui.pink]
            ];

            const tiles = values.map(([label, value, color], index) => {
              const column = index % 2;
              const row = Math.floor(index / 2);
              return metricTile(22 + column * 208, 72 + row * 56, 198, label, value, color);
            }).join('');

            const livePill = `
              <g>
                <rect x="370" y="20" width="58" height="21" rx="10.5" fill="${ui.green}" fill-opacity="0.11" stroke="${ui.green}" stroke-opacity="0.28"/>
                <circle cx="382" cy="30.5" r="3" fill="${ui.green}"/>
                <text x="390" y="34" style="font-size:9px;font-weight:700;fill:${ui.green};letter-spacing:0.6px">LIVE</text>
              </g>`;

            return cardShell(
              450,
              245,
              'GitHub Overview',
              `@${profile.login} · updated automatically`,
              `${livePill}${tiles}`
            );
          }

          function generateLanguagesCard(languageTotals) {
            const colors = [ui.blue, ui.purple, ui.pink, ui.cyan, ui.green, ui.orange];
            const entries = Object.entries(languageTotals)
              .sort((a, b) => b[1] - a[1])
              .slice(0, 6);
            const total = entries.reduce((sum, [, bytes]) => sum + bytes, 0) || 1;
            const barX = 22;
            const barY = 74;
            const barWidth = 406;
            const gap = 2;
            const usableWidth = barWidth - Math.max(entries.length - 1, 0) * gap;
            let cursor = barX;

            const segments = entries.map(([, bytes], index) => {
              const percent = bytes / total;
              const width = index === entries.length - 1
                ? Math.max(3, barX + barWidth - cursor)
                : Math.max(3, Math.round(usableWidth * percent));
              const segment = `<rect x="${cursor}" y="${barY}" width="${width}" height="12" fill="${colors[index]}"/>`;
              cursor += width + gap;
              return segment;
            }).join('');

            const rows = entries.map(([language, bytes], index) => {
              const column = index % 2;
              const row = Math.floor(index / 2);
              const x = 22 + column * 208;
              const y = 103 + row * 40;
              const percent = bytes / total * 100;

              return `
                <g>
                  <rect x="${x}" y="${y}" width="198" height="33" rx="11" fill="${ui.surface}" fill-opacity="0.66" stroke="#ffffff" stroke-opacity="0.06"/>
                  <circle cx="${x + 14}" cy="${y + 16.5}" r="4" fill="${colors[index]}"/>
                  <text x="${x + 26}" y="${y + 21}" style="font-size:11px;font-weight:620;fill:${ui.text}">${escapeXml(language)}</text>
                  <text x="${x + 185}" y="${y + 21}" text-anchor="end" style="font-size:10.5px;font-weight:650;fill:${ui.muted}">${percent.toFixed(1)}%</text>
                </g>`;
            }).join('');

            const extraDefs = `
              <clipPath id="language-bar-clip">
                <rect x="${barX}" y="${barY}" width="${barWidth}" height="12" rx="6"/>
              </clipPath>`;

            const body = entries.length
              ? `
                <rect x="${barX}" y="${barY}" width="${barWidth}" height="12" rx="6" fill="${ui.surfaceStrong}"/>
                <g clip-path="url(#language-bar-clip)">${segments}</g>
                ${rows}`
              : `<text x="22" y="92" class="caption">No language data available</text>`;

            return cardShell(
              450,
              245,
              'Languages',
              'Share of code across public repositories',
              body,
              extraDefs
            );
          }

          function activityTile(x, value, label, suffix, color) {
            return `
              <g>
                <rect x="${x}" y="77" width="280" height="129" rx="19" fill="${ui.surface}" fill-opacity="0.73" stroke="#ffffff" stroke-opacity="0.07"/>
                <circle cx="${x + 29}" cy="105" r="12" fill="${color}" fill-opacity="0.12" stroke="${color}" stroke-opacity="0.3"/>
                <circle cx="${x + 29}" cy="105" r="4" fill="${color}"/>
                <text x="${x + 50}" y="109" style="font-size:11px;font-weight:600;fill:${ui.muted}">${escapeXml(label)}</text>
                <text x="${x + 22}" y="164" style="font-size:39px;font-weight:750;fill:${ui.text};letter-spacing:-1px">${formatNumber(value)}</text>
                <text x="${x + 22}" y="188" style="font-size:10.5px;font-weight:500;fill:${ui.muted}">${escapeXml(suffix)}</text>
              </g>`;
          }

          function generateStreakCard(contributions) {
            const days = contributions?.contributionCalendar?.weeks?.flatMap((week) => week.contributionDays) || [];
            const streaks = calculateStreaks(days);
            const total = contributions?.contributionCalendar?.totalContributions || 0;
            const activeDays = days.filter((day) => day.contributionCount > 0).length;

            const body = `
              ${activityTile(22, streaks.current, 'Current streak', 'consecutive active days', ui.blue)}
              ${activityTile(320, total, 'Contributions', 'during the last 365 days', ui.purple)}
              ${activityTile(618, streaks.longest, 'Longest streak', `${formatNumber(activeDays)} active days this year`, ui.pink)}`;

            return cardShell(
              920,
              230,
              'Contribution Activity',
              'Live overview of your GitHub consistency',
              body
            );
          }

          (async () => {
            const profile = await github(`https://api.github.com/users/${username}`);
            const repositories = await getRepositories();
            const languageTotals = await getLanguageTotals(repositories);

            let contributions = null;
            try {
              contributions = await getContributions();
            } catch (error) {
              console.warn(`Could not retrieve contribution calendar: ${error.message}`);
            }

            fs.writeFileSync('dist/stats.svg', generateStatsCard(profile, repositories, contributions));
            fs.writeFileSync('dist/languages.svg', generateLanguagesCard(languageTotals));
            fs.writeFileSync('dist/streak.svg', generateStreakCard(contributions));
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Upload profile assets
        uses: actions/upload-artifact@v4
        with:
          name: profile-assets
          path: |
            dist/stats.svg
            dist/languages.svg
            dist/streak.svg
            dist/snake.svg
            dist/snake-dark.svg
            dist/pacman-contribution-graph.svg
            dist/pacman-contribution-graph-dark.svg
          if-no-files-found: error

  activity:
    permissions:
      contents: read

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Generate stock activity graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: ${{ github.repository_owner }}
          options: radius=16&theme=react&area=true
          output_path: dist/activity-graph-stock.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restyle activity graph
        run: |
          set -euo pipefail
          test -f dist/activity-graph-stock.svg
          grep -q '<svg' dist/activity-graph-stock.svg

          node preview/build-activity-graph-svg.mjs \
            --from-stock dist/activity-graph-stock.svg \
            --out dist/activity-graph.svg

          grep -q 'shelf-accent' dist/activity-graph.svg
          grep -q 'title-name' dist/activity-graph.svg
          grep -q '15171c' dist/activity-graph.svg
          ! grep -q 'ct:value' dist/activity-graph.svg
          test -f dist/activity-graph-meta.json

      - name: Upload activity assets
        uses: actions/upload-artifact@v4
        with:
          name: activity-assets
          path: |
            dist/activity-graph.svg
            dist/activity-graph-meta.json
          if-no-files-found: error

  trophy:
    permissions:
      contents: read

    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download stock trophy and restyle
        env:
          USERNAME: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          mkdir -p dist

          endpoints=(
            "https://github-profile-trophy.vercel.app"
            "https://github-profile-trophy-liard-delta.vercel.app"
            "https://github-profile-trophy-fork-two.vercel.app"
            "https://github-profile-trophy-winning.vercel.app"
            "https://trophy.ryglcloud.net"
          )

          success=false
          for endpoint in "${endpoints[@]}"; do
            url="${endpoint}/?username=${USERNAME}&theme=algolia&column=-1&row=1&margin-w=8&margin-h=8&no-bg=false&no-frame=false"
            echo "Trying ${endpoint}..."

            if curl --fail --location --silent --show-error --max-time 30 --retry 2 --retry-delay 2 "$url" -o dist/trophy-stock.svg; then
              if grep -q '<svg' dist/trophy-stock.svg; then
                success=true
                break
              fi
            fi
          done

          if [ "$success" != "true" ]; then
            echo "All trophy endpoints failed"
            exit 1
          fi

          node preview/build-trophies-svg.mjs \
            --from-stock dist/trophy-stock.svg \
            --out dist/trophy.svg
          test -f dist/trophy.svg
          test -f dist/trophies-data.json

      - name: Upload trophy assets
        uses: actions/upload-artifact@v4
        with:
          name: trophy-assets
          path: |
            dist/trophy.svg
            dist/trophies-data.json
          if-no-files-found: error

  quote:
    permissions:
      contents: read

    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Generate quote SVG
        run: |
          mkdir -p dist
          node <<'NODE'
          const fs = require('fs');

          const quotes = [
            { text: 'Simplicity is prerequisite for reliability.', author: 'Edsger W. Dijkstra' },
            { text: 'Make it work, make it right, make it fast.', author: 'Kent Beck' },
            { text: 'Talk is cheap. Show me the code.', author: 'Linus Torvalds' },
            { text: 'Programs must be written for people to read, and only incidentally for machines to execute.', author: 'Harold Abelson' },
            { text: 'First, solve the problem. Then, write the code.', author: 'John Johnson' },
            { text: 'The best error message is the one that never shows up.', author: 'Thomas Fuchs' },
            { text: 'Any fool can write code that a computer can understand. Good programmers write code that humans can understand.', author: 'Martin Fowler' },
            { text: 'Before software can be reusable it first has to be usable.', author: 'Ralph Johnson' },
            { text: 'Fix the cause, not the symptom.', author: 'Steve Maguire' },
            { text: 'Code is like humor. When you have to explain it, it is bad.', author: 'Cory House' },
            { text: 'The most effective debugging tool is still careful thought, coupled with judiciously placed print statements.', author: 'Brian Kernighan' },
            { text: 'Good code is its own best documentation.', author: 'Steve McConnell' }
          ];

          const day = Math.floor(Date.now() / 86400000);
          const quote = quotes[day % quotes.length];

          const escapeXml = (value) => String(value)
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&apos;');

          function wrap(text, max = 52) {
            const words = text.split(/\s+/);
            const lines = [];
            let current = '';

            for (const word of words) {
              const candidate = current ? `${current} ${word}` : word;
              if (candidate.length > max && current) {
                lines.push(current);
                current = word;
              } else {
                current = candidate;
              }
            }

            if (current) lines.push(current);
            return lines.slice(0, 3);
          }

          const lines = wrap(quote.text);
          const firstY = lines.length === 1 ? 102 : lines.length === 2 ? 91 : 80;
          const lineHeight = 28;
          const quoteLines = lines.map((line, index) =>
            `<text x="72" y="${firstY + index * lineHeight}" class="quote">${escapeXml(line)}</text>`
          ).join('\n');
          const authorY = lines.length === 1 ? 137 : lines.length === 2 ? 146 : 154;

          const svg = `<?xml version="1.0" encoding="UTF-8"?>
          <svg xmlns="http://www.w3.org/2000/svg" width="920" height="180" viewBox="0 0 920 180" role="img" aria-label="Random developer quote">
            <defs>
              <linearGradient id="card-bg" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#15171c"/>
                <stop offset="100%" stop-color="#090a0d"/>
              </linearGradient>
              <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0%" stop-color="#0a84ff"/>
                <stop offset="52%" stop-color="#bf5af2"/>
                <stop offset="100%" stop-color="#ff375f"/>
              </linearGradient>
              <radialGradient id="blue-glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(90 22) rotate(35) scale(260 140)">
                <stop stop-color="#0a84ff" stop-opacity="0.16"/>
                <stop offset="1" stop-color="#0a84ff" stop-opacity="0"/>
              </radialGradient>
              <radialGradient id="purple-glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(830 180) rotate(-140) scale(250 150)">
                <stop stop-color="#bf5af2" stop-opacity="0.12"/>
                <stop offset="1" stop-color="#bf5af2" stop-opacity="0"/>
              </radialGradient>
              <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
                <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.32"/>
              </filter>
              <style>
                text { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif; text-rendering: geometricPrecision; }
                .eyebrow { font-size: 10px; font-weight: 800; fill: #64d2ff; letter-spacing: 1.6px; }
                .sub { font-size: 10px; font-weight: 500; fill: #98989f; }
                .quote { font-size: 22px; font-weight: 680; fill: #f5f5f7; letter-spacing: -0.35px; }
                .author { font-size: 14px; font-weight: 600; fill: #a7a7b0; }
              </style>
            </defs>
            <rect x="7" y="9" width="906" height="164" rx="24" fill="#000" opacity="0.24" filter="url(#shadow)"/>
            <rect x="1" y="1" width="918" height="178" rx="23" fill="url(#card-bg)" stroke="#343741" stroke-width="1.25"/>
            <rect x="1" y="1" width="918" height="178" rx="23" fill="url(#blue-glow)"/>
            <rect x="1" y="1" width="918" height="178" rx="23" fill="url(#purple-glow)"/>
            <path d="M24 1 H896" stroke="url(#accent)" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
            <text x="72" y="38" class="eyebrow">DAILY DEV QUOTE</text>
            <text x="72" y="54" class="sub">A little signal between the commits.</text>
            <g fill="#bf5af2" opacity="0.22">
              <path d="M758 58 H794 L783 124 H742 Z"/>
              <path d="M808 58 H844 L833 124 H792 Z"/>
            </g>
            ${quoteLines}
            <g transform="translate(72 ${authorY})">
              <rect x="0" y="-14" width="5" height="20" rx="2.5" fill="#bf5af2"/>
              <text x="16" y="0" class="author">— ${escapeXml(quote.author)}</text>
            </g>
          </svg>`;

          fs.writeFileSync('dist/dev-quote-v4.svg', svg);
          NODE

      - name: Upload quote asset
        uses: actions/upload-artifact@v4
        with:
          name: quote-assets
          path: dist/dev-quote-v4.svg
          if-no-files-found: error

  publish:
    needs: [profile, activity, trophy, quote]
    permissions:
      contents: write

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout main for publishing
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download generated artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish all assets in one commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          mkdir -p assets/generated
          for file in \
            stats.svg \
            languages.svg \
            streak.svg \
            snake.svg \
            snake-dark.svg \
            pacman-contribution-graph.svg \
            pacman-contribution-graph-dark.svg; do
            test -f "artifacts/profile-assets/$file"
            cp "artifacts/profile-assets/$file" "assets/generated/$file"
          done

          for file in activity-graph.svg activity-graph-meta.json; do
            test -f "artifacts/activity-assets/$file"
            cp "artifacts/activity-assets/$file" "assets/generated/$file"
          done

          for file in trophy.svg trophies-data.json; do
            test -f "artifacts/trophy-assets/$file"
            cp "artifacts/trophy-assets/$file" "assets/generated/$file"
          done

          test -f artifacts/quote-assets/dev-quote-v4.svg
          cp artifacts/quote-assets/dev-quote-v4.svg assets/generated/dev-quote-v4.svg

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/generated/stats.svg \
            assets/generated/languages.svg \
            assets/generated/streak.svg \
            assets/generated/snake.svg \
            assets/generated/snake-dark.svg \
            assets/generated/pacman-contribution-graph.svg \
            assets/generated/pacman-contribution-graph-dark.svg \
            assets/generated/activity-graph.svg \
            assets/generated/activity-graph-meta.json \
            assets/generated/trophy.svg \
            assets/generated/trophies-data.json \
            assets/generated/dev-quote-v4.svg

          if git diff --cached --quiet; then
            echo "All generated assets are unchanged"
            exit 0
          fi

          git commit -m "Update generated profile assets"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "Published all assets on attempt ${attempt}"
              exit 0
            fi
            echo "Push attempt ${attempt} failed; retrying..."
            sleep $((attempt * 3))
          done
          echo "Failed to publish generated assets after retries"
          exit 1
