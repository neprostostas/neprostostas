name: Update Activity Graph

on:
  schedule:
    - cron: "5 */12 * * *"
  workflow_dispatch:

concurrency:
  group: activity-graph-output
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: write

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout build script
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            preview/build-activity-graph-svg.mjs
          sparse-checkout-cone-mode: false

      - name: Generate stock activity graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: ${{ github.repository_owner }}
          options: radius=16&theme=react&area=true
          output_path: dist/activity-graph-stock.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restyle into custom SVG
        run: |
          set -euo pipefail
          test -f dist/activity-graph-stock.svg
          grep -q '<svg' dist/activity-graph-stock.svg

          node preview/build-activity-graph-svg.mjs \
            --from-stock dist/activity-graph-stock.svg \
            --out dist/activity-graph.svg

          # Sanity: styled chrome markers (not the stock react theme)
          grep -q 'shelf-accent' dist/activity-graph.svg
          grep -q 'title-name' dist/activity-graph.svg
          grep -q '15171c' dist/activity-graph.svg
          ! grep -q 'ct:value' dist/activity-graph.svg

          ls -la dist/activity-graph.svg dist/activity-graph-meta.json

      - name: Push activity graph to activity-graph-output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_BRANCH: activity-graph-output
        run: |
          set -euo pipefail
          cd dist
          git init
          git checkout --orphan "$TARGET_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Ship styled SVG (README already points here) + meta
          git add activity-graph.svg
          if [ -f activity-graph-meta.json ]; then git add activity-graph-meta.json; fi
          git commit --allow-empty -m "Update styled activity graph"
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for attempt in 1 2 3 4 5; do
            if git push --force "$remote" "HEAD:refs/heads/${TARGET_BRANCH}"; then
              echo "Pushed on attempt ${attempt}"
              exit 0
            fi
            echo "Push attempt ${attempt} failed; retrying..."
            sleep $((attempt * 3))
          done
          echo "Failed to push after retries"
          exit 1
