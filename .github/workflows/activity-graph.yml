name: Update Activity Graph

on:
  schedule:
    - cron: "5 */12 * * *"
  workflow_dispatch:

concurrency:
  group: generated-assets-main-activity
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: write

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout build script
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Generate stock activity graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: ${{ github.repository_owner }}
          options: radius=16&theme=react&area=true
          output_path: dist/activity-graph-stock.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restyle into custom SVG
        run: |
          set -euo pipefail
          test -f dist/activity-graph-stock.svg
          grep -q '<svg' dist/activity-graph-stock.svg

          node preview/build-activity-graph-svg.mjs \
            --from-stock dist/activity-graph-stock.svg \
            --out dist/activity-graph.svg

          # Sanity: styled chrome markers (not the stock react theme)
          grep -q 'shelf-accent' dist/activity-graph.svg
          grep -q 'title-name' dist/activity-graph.svg
          grep -q '15171c' dist/activity-graph.svg
          ! grep -q 'ct:value' dist/activity-graph.svg

          ls -la dist/activity-graph.svg dist/activity-graph-meta.json

      - name: Commit activity graph to main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          mkdir -p assets/generated
          cp dist/activity-graph.svg assets/generated/activity-graph.svg
          if [ -f dist/activity-graph-meta.json ]; then
            cp dist/activity-graph-meta.json assets/generated/activity-graph-meta.json
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/generated/activity-graph.svg
          if [ -f assets/generated/activity-graph-meta.json ]; then
            git add assets/generated/activity-graph-meta.json
          fi

          if git diff --cached --quiet; then
            echo "Activity graph is unchanged"
            exit 0
          fi

          git commit -m "Update styled activity graph"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "Pushed on attempt ${attempt}"
              exit 0
            fi
            echo "Push attempt ${attempt} failed; retrying..."
            sleep $((attempt * 3))
          done
          echo "Failed to push after retries"
          exit 1
