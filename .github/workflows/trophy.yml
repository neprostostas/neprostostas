name: Generate trophy card

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

concurrency:
  group: trophy-output
  cancel-in-progress: true

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Download trophy.svg
        env:
          USERNAME: ${{ github.repository_owner }}
        run: |
          mkdir -p dist

          endpoints=(
            "https://github-profile-trophy.vercel.app"
            "https://github-profile-trophy-liard-delta.vercel.app"
            "https://github-profile-trophy-fork-two.vercel.app"
            "https://github-profile-trophy-winning.vercel.app"
            "https://trophy.ryglcloud.net"
          )

          success=false

          for endpoint in "${endpoints[@]}"; do
            url="${endpoint}/?username=${USERNAME}&theme=algolia&column=-1&row=1&margin-w=8&margin-h=8&no-bg=false&no-frame=false"
            echo "Trying ${endpoint}..."

            if curl --fail --location --silent --show-error --max-time 30 --retry 2 --retry-delay 2 "$url" -o dist/trophy.tmp.svg; then
              if grep -q '<svg' dist/trophy.tmp.svg; then
                mv dist/trophy.tmp.svg dist/trophy.svg
                echo "Trophy generated successfully via ${endpoint}"
                success=true
                break
              fi
            fi
          done

          rm -f dist/trophy.tmp.svg

          if [ "$success" != "true" ]; then
            echo "All trophy endpoints failed"
            exit 1
          fi

      - name: Push trophy.svg to trophy-output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_BRANCH: trophy-output
        run: |
          set -euo pipefail
          cd dist
          git init
          git checkout --orphan "$TARGET_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit --allow-empty -m "Update trophy card"
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for attempt in 1 2 3 4 5; do
            if git push --force "$remote" "HEAD:refs/heads/${TARGET_BRANCH}"; then
              echo "Pushed on attempt ${attempt}"
              exit 0
            fi
            echo "Push attempt ${attempt} failed; retrying..."
            sleep $((attempt * 3))
          done
          echo "Failed to push after retries"
          exit 1
