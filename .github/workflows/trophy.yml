name: Generate trophy card

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

concurrency:
  group: trophy-output
  cancel-in-progress: true

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout build script
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            preview/build-trophies-svg.mjs
          sparse-checkout-cone-mode: false

      - name: Download stock trophy.svg + restyle
        env:
          USERNAME: ${{ github.repository_owner }}
        run: |
          mkdir -p dist

          endpoints=(
            "https://github-profile-trophy.vercel.app"
            "https://github-profile-trophy-liard-delta.vercel.app"
            "https://github-profile-trophy-fork-two.vercel.app"
            "https://github-profile-trophy-winning.vercel.app"
            "https://trophy.ryglcloud.net"
          )

          success=false

          for endpoint in "${endpoints[@]}"; do
            url="${endpoint}/?username=${USERNAME}&theme=algolia&column=-1&row=1&margin-w=8&margin-h=8&no-bg=false&no-frame=false"
            echo "Trying ${endpoint}..."

            if curl --fail --location --silent --show-error --max-time 30 --retry 2 --retry-delay 2 "$url" -o dist/trophy-stock.svg; then
              if grep -q '<svg' dist/trophy-stock.svg; then
                echo "Stock trophy downloaded via ${endpoint}"
                success=true
                break
              fi
            fi
          done

          if [ "$success" != "true" ]; then
            echo "All trophy endpoints failed"
            exit 1
          fi

          # Restyle into our SVG; text/ranks come from the stock file (Actions-fed).
          node preview/build-trophies-svg.mjs \
            --from-stock dist/trophy-stock.svg \
            --out dist/trophy.svg

          ls -la dist/trophy.svg dist/trophies-data.json

      - name: Push trophy.svg to trophy-output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_BRANCH: trophy-output
        run: |
          set -euo pipefail
          cd dist
          git init
          git checkout --orphan "$TARGET_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Ship styled SVG as trophy.svg (README already points here) + data JSON
          git add trophy.svg
          if [ -f trophies-data.json ]; then git add trophies-data.json; fi
          git commit --allow-empty -m "Update styled trophy card"
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for attempt in 1 2 3 4 5; do
            if git push --force "$remote" "HEAD:refs/heads/${TARGET_BRANCH}"; then
              echo "Pushed on attempt ${attempt}"
              exit 0
            fi
            echo "Push attempt ${attempt} failed; retrying..."
            sleep $((attempt * 3))
          done
          echo "Failed to push after retries"
          exit 1
