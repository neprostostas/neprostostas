name: Generate random dev quote

on:
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate quote SVG
        run: |
          mkdir -p dist
          node <<'NODE'
          const fs = require('fs');

          const quotes = [
            { text: 'Simplicity is prerequisite for reliability.', author: 'Edsger W. Dijkstra' },
            { text: 'Make it work, make it right, make it fast.', author: 'Kent Beck' },
            { text: 'Talk is cheap. Show me the code.', author: 'Linus Torvalds' },
            { text: 'Programs must be written for people to read, and only incidentally for machines to execute.', author: 'Harold Abelson' },
            { text: 'First, solve the problem. Then, write the code.', author: 'John Johnson' },
            { text: 'The best error message is the one that never shows up.', author: 'Thomas Fuchs' },
            { text: 'Any fool can write code that a computer can understand. Good programmers write code that humans can understand.', author: 'Martin Fowler' },
            { text: 'Before software can be reusable it first has to be usable.', author: 'Ralph Johnson' },
            { text: 'Fix the cause, not the symptom.', author: 'Steve Maguire' },
            { text: 'Code is like humor. When you have to explain it, it is bad.', author: 'Cory House' },
            { text: 'The most effective debugging tool is still careful thought, coupled with judiciously placed print statements.', author: 'Brian Kernighan' },
            { text: 'Good code is its own best documentation.', author: 'Steve McConnell' }
          ];

          const day = Math.floor(Date.now() / 86400000);
          const quote = quotes[day % quotes.length];

          const escapeXml = (value) => String(value)
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&apos;');

          function wrap(text, max = 63) {
            const words = text.split(/\s+/);
            const lines = [];
            let current = '';

            for (const word of words) {
              const candidate = current ? `${current} ${word}` : word;
              if (candidate.length > max && current) {
                lines.push(current);
                current = word;
              } else {
                current = candidate;
              }
            }

            if (current) lines.push(current);
            return lines.slice(0, 3);
          }

          const lines = wrap(quote.text);
          const firstY = lines.length === 1 ? 120 : lines.length === 2 ? 104 : 90;
          const lineHeight = 31;

          const quoteLines = lines.map((line, index) =>
            `<text x="82" y="${firstY + index * lineHeight}" class="quote">${escapeXml(line)}</text>`
          ).join('\n');

          const svg = `<?xml version="1.0" encoding="UTF-8"?>
          <svg xmlns="http://www.w3.org/2000/svg" width="920" height="230" viewBox="0 0 920 230" role="img" aria-label="Random developer quote">
            <defs>
              <linearGradient id="card-bg" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#15171c"/>
                <stop offset="100%" stop-color="#090a0d"/>
              </linearGradient>
              <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0%" stop-color="#0a84ff"/>
                <stop offset="52%" stop-color="#bf5af2"/>
                <stop offset="100%" stop-color="#ff375f"/>
              </linearGradient>
              <radialGradient id="blue-glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(110 26) rotate(35) scale(300 170)">
                <stop stop-color="#0a84ff" stop-opacity="0.18"/>
                <stop offset="1" stop-color="#0a84ff" stop-opacity="0"/>
              </radialGradient>
              <radialGradient id="purple-glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(840 220) rotate(-140) scale(280 165)">
                <stop stop-color="#bf5af2" stop-opacity="0.16"/>
                <stop offset="1" stop-color="#bf5af2" stop-opacity="0"/>
              </radialGradient>
              <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
                <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.32"/>
              </filter>
              <style>
                text { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif; text-rendering: geometricPrecision; }
                .eyebrow { font-size: 14px; font-weight: 800; fill: #64d2ff; letter-spacing: 2.2px; }
                .quote { font-size: 24px; font-weight: 650; fill: #f5f5f7; letter-spacing: -0.35px; }
                .author { font-size: 14px; font-weight: 600; fill: #98989f; }
              </style>
            </defs>

            <rect x="7" y="9" width="906" height="214" rx="24" fill="#000" opacity="0.24" filter="url(#shadow)"/>
            <rect x="1" y="1" width="918" height="228" rx="23" fill="url(#card-bg)" stroke="#343741" stroke-width="1.25"/>
            <rect x="1" y="1" width="918" height="228" rx="23" fill="url(#blue-glow)"/>
            <rect x="1" y="1" width="918" height="228" rx="23" fill="url(#purple-glow)"/>
            <path d="M24 1 H896" stroke="url(#accent)" stroke-width="2" stroke-linecap="round" opacity="0.85"/>

            <g>
              <circle cx="48" cy="47" r="18" fill="#0a84ff" fill-opacity="0.11" stroke="#0a84ff" stroke-opacity="0.28"/>
              <text x="48" y="50" text-anchor="middle" dominant-baseline="middle" style="font-size:30px;font-weight:800;fill:#64d2ff">“</text>
              <text x="96" y="41" class="eyebrow">DAILY DEV QUOTE</text>
              <text x="96" y="64" style="font-size:14px;font-weight:500;fill:#98989f">A little signal between the commits.</text>
            </g>

            ${quoteLines}

            <g transform="translate(82 168)">
              <rect x="0" y="-15" width="4" height="20" rx="2" fill="#bf5af2"/>
              <text x="14" y="0" class="author">— ${escapeXml(quote.author)}</text>
            </g>
          </svg>`;

          fs.writeFileSync('dist/dev-quote.svg', svg);
          NODE

      - name: Push quote SVG to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: quote-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
