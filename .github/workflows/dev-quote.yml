name: Generate random dev quote

on:
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch:

concurrency:
  group: generated-assets-main
  cancel-in-progress: true

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Generate quote SVG
        run: |
          mkdir -p dist
          node <<'NODE'
          const fs = require('fs');

          const quotes = [
            { text: 'Simplicity is prerequisite for reliability.', author: 'Edsger W. Dijkstra' },
            { text: 'Make it work, make it right, make it fast.', author: 'Kent Beck' },
            { text: 'Talk is cheap. Show me the code.', author: 'Linus Torvalds' },
            { text: 'Programs must be written for people to read, and only incidentally for machines to execute.', author: 'Harold Abelson' },
            { text: 'First, solve the problem. Then, write the code.', author: 'John Johnson' },
            { text: 'The best error message is the one that never shows up.', author: 'Thomas Fuchs' },
            { text: 'Any fool can write code that a computer can understand. Good programmers write code that humans can understand.', author: 'Martin Fowler' },
            { text: 'Before software can be reusable it first has to be usable.', author: 'Ralph Johnson' },
            { text: 'Fix the cause, not the symptom.', author: 'Steve Maguire' },
            { text: 'Code is like humor. When you have to explain it, it is bad.', author: 'Cory House' },
            { text: 'The most effective debugging tool is still careful thought, coupled with judiciously placed print statements.', author: 'Brian Kernighan' },
            { text: 'Good code is its own best documentation.', author: 'Steve McConnell' }
          ];

          const day = Math.floor(Date.now() / 86400000);
          const quote = quotes[day % quotes.length];

          const escapeXml = (value) => String(value)
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&apos;');

          function wrap(text, max = 52) {
            const words = text.split(/\s+/);
            const lines = [];
            let current = '';

            for (const word of words) {
              const candidate = current ? `${current} ${word}` : word;
              if (candidate.length > max && current) {
                lines.push(current);
                current = word;
              } else {
                current = candidate;
              }
            }

            if (current) lines.push(current);
            return lines.slice(0, 3);
          }

          const lines = wrap(quote.text);
          const firstY = lines.length === 1 ? 102 : lines.length === 2 ? 91 : 80;
          const lineHeight = 28;

          const quoteLines = lines.map((line, index) =>
            `<text x="72" y="${firstY + index * lineHeight}" class="quote">${escapeXml(line)}</text>`
          ).join('\n');

          const authorY = lines.length === 1 ? 137 : lines.length === 2 ? 146 : 154;

          const svg = `<?xml version="1.0" encoding="UTF-8"?>
          <svg xmlns="http://www.w3.org/2000/svg" width="920" height="180" viewBox="0 0 920 180" role="img" aria-label="Random developer quote">
            <defs>
              <linearGradient id="card-bg" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#15171c"/>
                <stop offset="100%" stop-color="#090a0d"/>
              </linearGradient>
              <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0%" stop-color="#0a84ff"/>
                <stop offset="52%" stop-color="#bf5af2"/>
                <stop offset="100%" stop-color="#ff375f"/>
              </linearGradient>
              <radialGradient id="blue-glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(90 22) rotate(35) scale(260 140)">
                <stop stop-color="#0a84ff" stop-opacity="0.16"/>
                <stop offset="1" stop-color="#0a84ff" stop-opacity="0"/>
              </radialGradient>
              <radialGradient id="purple-glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(830 180) rotate(-140) scale(250 150)">
                <stop stop-color="#bf5af2" stop-opacity="0.12"/>
                <stop offset="1" stop-color="#bf5af2" stop-opacity="0"/>
              </radialGradient>
              <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
                <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.32"/>
              </filter>
              <style>
                text { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif; text-rendering: geometricPrecision; }
                .eyebrow { font-size: 10px; font-weight: 800; fill: #64d2ff; letter-spacing: 1.6px; }
                .sub { font-size: 10px; font-weight: 500; fill: #98989f; }
                .quote { font-size: 22px; font-weight: 680; fill: #f5f5f7; letter-spacing: -0.35px; }
                .author { font-size: 14px; font-weight: 600; fill: #a7a7b0; }
              </style>
            </defs>

            <rect x="7" y="9" width="906" height="164" rx="24" fill="#000" opacity="0.24" filter="url(#shadow)"/>
            <rect x="1" y="1" width="918" height="178" rx="23" fill="url(#card-bg)" stroke="#343741" stroke-width="1.25"/>
            <rect x="1" y="1" width="918" height="178" rx="23" fill="url(#blue-glow)"/>
            <rect x="1" y="1" width="918" height="178" rx="23" fill="url(#purple-glow)"/>
            <path d="M24 1 H896" stroke="url(#accent)" stroke-width="2" stroke-linecap="round" opacity="0.85"/>

            <text x="72" y="38" class="eyebrow">DAILY DEV QUOTE</text>
            <text x="72" y="54" class="sub">A little signal between the commits.</text>

            <g fill="#bf5af2" opacity="0.22">
              <path d="M758 58 H794 L783 124 H742 Z"/>
              <path d="M808 58 H844 L833 124 H792 Z"/>
            </g>

            ${quoteLines}

            <g transform="translate(72 ${authorY})">
              <rect x="0" y="-14" width="5" height="20" rx="2.5" fill="#bf5af2"/>
              <text x="16" y="0" class="author">— ${escapeXml(quote.author)}</text>
            </g>
          </svg>`;

          fs.writeFileSync('dist/dev-quote-v4.svg', svg);
          NODE

      - name: Commit quote SVG to main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          mkdir -p assets/generated
          cp dist/dev-quote-v4.svg assets/generated/dev-quote-v4.svg

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/generated/dev-quote-v4.svg

          if git diff --cached --quiet; then
            echo "Daily quote is unchanged"
            exit 0
          fi

          git commit -m "Update daily quote"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "Pushed on attempt ${attempt}"
              exit 0
            fi
            echo "Push attempt ${attempt} failed; retrying..."
            sleep $((attempt * 3))
          done
          echo "Failed to push after retries"
          exit 1
